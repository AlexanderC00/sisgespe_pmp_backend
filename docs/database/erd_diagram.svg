<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtro sombra suave -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Marcadores de flechas/conectores -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    
    <!-- Puntos de conexión circulares -->
    <marker id="dot-blue" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
    </marker>
    <marker id="dot-amber" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5">
      <circle cx="4" cy="4" r="3" fill="#fbbf24" />
    </marker>
    <marker id="dot-emerald" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5">
      <circle cx="4" cy="4" r="3" fill="#34d399" />
    </marker>
    <marker id="dot-purple" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5">
      <circle cx="4" cy="4" r="3" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Título Superior -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">DIAGRAMA ENTIDAD - RELACIÓN (ERD)</text>
    <text x="0" y="22" fill="#94a3b8" font-size="13">Sistema de Gestión y Pedidos de Productos Mínimamente Procesados (SISGESPE PMP)</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(800, 30)">
    <rect x="0" y="0" width="280" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="12" y="12" width="28" height="15" rx="3" fill="#fbbf24" />
    <text x="26" y="23" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">PK</text>
    <text x="45" y="23" fill="#cbd5e1" font-size="11">Primaria</text>

    <rect x="102" y="12" width="28" height="15" rx="3" fill="#38bdf8" />
    <text x="116" y="23" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">FK</text>
    <text x="135" y="23" fill="#cbd5e1" font-size="11">Foránea</text>

    <rect x="190" y="12" width="28" height="15" rx="3" fill="#34d399" />
    <text x="204" y="23" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">UK</text>
    <text x="223" y="23" fill="#cbd5e1" font-size="11">Única</text>
  </g>

  <!-- ========================================================= -->
  <!-- LINEAS DE RELACIÓN / CONECTORES (Dibujadas detrás)       -->
  <!-- ========================================================= -->

  <!-- 1. USERS -> PEDIDOS (1:N) -->
  <g>
    <path d="M 330 160 L 410 160" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="none" marker-start="url(#dot-blue)" marker-end="url(#arrow-blue)" />
    <rect x="342" y="142" width="55" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="369" y="155" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>
  </g>

  <!-- 2. PEDIDOS -> DETALLE_PEDIDOS (1:N) -->
  <g>
    <path d="M 700 160 L 780 160" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="none" marker-start="url(#dot-amber)" marker-end="url(#arrow-amber)" />
    <rect x="712" y="142" width="55" height="18" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="739" y="155" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>
  </g>

  <!-- 3. PRODUCTOS -> DETALLE_PEDIDOS (1:N) -->
  <g>
    <path d="M 925 410 L 925 350" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="none" marker-start="url(#dot-purple)" marker-end="url(#arrow-purple)" />
    <rect x="898" y="368" width="55" height="18" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
    <text x="925" y="381" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>
  </g>

  <!-- 4. PRODUCTOS -> INVENTARIOS (1:1) -->
  <g>
    <path d="M 780 500 L 700 500" stroke="#34d399" stroke-width="2.5" stroke-dasharray="none" marker-start="url(#dot-emerald)" marker-end="url(#arrow-emerald)" />
    <rect x="712" y="482" width="55" height="18" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="739" y="495" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">1 : 1</text>
  </g>

  <!-- ========================================================= -->
  <!-- TABLA 1: USERS                                            -->
  <!-- ========================================================= -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect width="290" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Cabecera -->
    <path d="M 0 10 Q 0 0 10 0 L 280 0 Q 290 0 290 10 L 290 42 L 0 42 Z" fill="#1e3a8a" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">users</text>
    <text x="275" y="26" fill="#93c5fd" font-size="11" text-anchor="end">App\Models\User</text>

    <!-- Campos -->
    <!-- id -->
    <rect x="14" y="52" width="26" height="15" rx="3" fill="#fbbf24" />
    <text x="27" y="63" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="275" y="64" fill="#94a3b8" font-size="11" text-anchor="end">BIGINT (Auto)</text>
    <line x1="14" y1="73" x2="275" y2="73" stroke="#334155" stroke-width="0.7" />

    <!-- name -->
    <text x="48" y="88" fill="#f1f5f9" font-size="12">name</text>
    <text x="275" y="88" fill="#94a3b8" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <!-- email -->
    <rect x="14" y="99" width="26" height="15" rx="3" fill="#34d399" />
    <text x="27" y="110" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">UK</text>
    <text x="48" y="111" fill="#f1f5f9" font-size="12" font-weight="600">email</text>
    <text x="275" y="111" fill="#94a3b8" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <!-- password -->
    <text x="48" y="133" fill="#f1f5f9" font-size="12">password</text>
    <text x="275" y="133" fill="#94a3b8" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <!-- rol -->
    <text x="48" y="155" fill="#f1f5f9" font-size="12">rol</text>
    <text x="275" y="155" fill="#38bdf8" font-size="11" text-anchor="end">ENUM('admin','cliente')</text>

    <!-- email_verified_at -->
    <text x="48" y="177" fill="#94a3b8" font-size="12">email_verified_at</text>
    <text x="275" y="177" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP (null)</text>

    <!-- remember_token -->
    <text x="48" y="199" fill="#94a3b8" font-size="12">remember_token</text>
    <text x="275" y="199" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(100) (null)</text>

    <!-- created_at / updated_at -->
    <line x1="14" y1="211" x2="275" y2="211" stroke="#334155" stroke-width="0.7" />
    <text x="48" y="228" fill="#64748b" font-size="11">created_at / updated_at</text>
    <text x="275" y="228" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP</text>
  </g>

  <!-- ========================================================= -->
  <!-- TABLA 2: PEDIDOS                                          -->
  <!-- ========================================================= -->
  <g transform="translate(410, 90)" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect width="290" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Cabecera -->
    <path d="M 0 10 Q 0 0 10 0 L 280 0 Q 290 0 290 10 L 290 42 L 0 42 Z" fill="#78350f" />
    <circle cx="20" cy="21" r="5" fill="#fbbf24" />
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">pedidos</text>
    <text x="275" y="26" fill="#fde68a" font-size="11" text-anchor="end">App\Models\Pedido</text>

    <!-- Campos -->
    <!-- id -->
    <rect x="14" y="52" width="26" height="15" rx="3" fill="#fbbf24" />
    <text x="27" y="63" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="275" y="64" fill="#94a3b8" font-size="11" text-anchor="end">BIGINT (Auto)</text>
    <line x1="14" y1="73" x2="275" y2="73" stroke="#334155" stroke-width="0.7" />

    <!-- user_id -->
    <rect x="14" y="81" width="26" height="15" rx="3" fill="#38bdf8" />
    <text x="27" y="92" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="93" fill="#f1f5f9" font-size="12" font-weight="600">user_id</text>
    <text x="275" y="93" fill="#38bdf8" font-size="11" text-anchor="end">BIGINT (Cascade)</text>

    <!-- fecha_pedido -->
    <text x="48" y="120" fill="#f1f5f9" font-size="12">fecha_pedido</text>
    <text x="275" y="120" fill="#94a3b8" font-size="11" text-anchor="end">DATETIME</text>

    <!-- estado_pedido -->
    <text x="48" y="147" fill="#f1f5f9" font-size="12">estado_pedido</text>
    <text x="275" y="147" fill="#fbbf24" font-size="11" text-anchor="end">ENUM(pendiente,...)</text>

    <!-- total -->
    <text x="48" y="174" fill="#f1f5f9" font-size="12">total</text>
    <text x="275" y="174" fill="#94a3b8" font-size="11" text-anchor="end">DECIMAL(10,2)</text>

    <!-- created_at / updated_at -->
    <line x1="14" y1="211" x2="275" y2="211" stroke="#334155" stroke-width="0.7" />
    <text x="48" y="228" fill="#64748b" font-size="11">created_at / updated_at</text>
    <text x="275" y="228" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP</text>
  </g>

  <!-- ========================================================= -->
  <!-- TABLA 3: DETALLE_PEDIDOS                                  -->
  <!-- ========================================================= -->
  <g transform="translate(780, 90)" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect width="290" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Cabecera -->
    <path d="M 0 10 Q 0 0 10 0 L 280 0 Q 290 0 290 10 L 290 42 L 0 42 Z" fill="#581c87" />
    <circle cx="20" cy="21" r="5" fill="#c084fc" />
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">detalle_pedidos</text>
    <text x="275" y="26" fill="#e9d5ff" font-size="11" text-anchor="end">App\Models\DetallePedido</text>

    <!-- Campos -->
    <!-- id -->
    <rect x="14" y="52" width="26" height="15" rx="3" fill="#fbbf24" />
    <text x="27" y="63" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="275" y="64" fill="#94a3b8" font-size="11" text-anchor="end">BIGINT (Auto)</text>
    <line x1="14" y1="73" x2="275" y2="73" stroke="#334155" stroke-width="0.7" />

    <!-- pedido_id -->
    <rect x="14" y="81" width="26" height="15" rx="3" fill="#38bdf8" />
    <text x="27" y="92" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="93" fill="#f1f5f9" font-size="12" font-weight="600">pedido_id</text>
    <text x="275" y="93" fill="#fbbf24" font-size="11" text-anchor="end">BIGINT (Cascade)</text>

    <!-- producto_id -->
    <rect x="14" y="107" width="26" height="15" rx="3" fill="#38bdf8" />
    <text x="27" y="118" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="119" fill="#f1f5f9" font-size="12" font-weight="600">producto_id</text>
    <text x="275" y="119" fill="#f43f5e" font-size="11" text-anchor="end">BIGINT (Restrict)</text>

    <!-- cantidad -->
    <text x="48" y="146" fill="#f1f5f9" font-size="12">cantidad</text>
    <text x="275" y="146" fill="#94a3b8" font-size="11" text-anchor="end">INTEGER</text>

    <!-- precio_unitario_historico -->
    <text x="48" y="173" fill="#f1f5f9" font-size="12">precio_unitario_hist.</text>
    <text x="275" y="173" fill="#94a3b8" font-size="11" text-anchor="end">DECIMAL(8,2)</text>

    <!-- created_at / updated_at -->
    <line x1="14" y1="211" x2="275" y2="211" stroke="#334155" stroke-width="0.7" />
    <text x="48" y="228" fill="#64748b" font-size="11">created_at / updated_at</text>
    <text x="275" y="228" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP</text>
  </g>

  <!-- ========================================================= -->
  <!-- TABLA 4: INVENTARIOS                                      -->
  <!-- ========================================================= -->
  <g transform="translate(410, 410)" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect width="290" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Cabecera -->
    <path d="M 0 10 Q 0 0 10 0 L 280 0 Q 290 0 290 10 L 290 42 L 0 42 Z" fill="#134e4a" />
    <circle cx="20" cy="21" r="5" fill="#2dd4bf" />
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">inventarios</text>
    <text x="275" y="26" fill="#99f6e4" font-size="11" text-anchor="end">App\Models\Inventario</text>

    <!-- Campos -->
    <!-- id -->
    <rect x="14" y="52" width="26" height="15" rx="3" fill="#fbbf24" />
    <text x="27" y="63" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="275" y="64" fill="#94a3b8" font-size="11" text-anchor="end">BIGINT (Auto)</text>
    <line x1="14" y1="73" x2="275" y2="73" stroke="#334155" stroke-width="0.7" />

    <!-- producto_id -->
    <rect x="14" y="81" width="26" height="15" rx="3" fill="#38bdf8" />
    <text x="27" y="92" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="93" fill="#f1f5f9" font-size="12" font-weight="600">producto_id</text>
    <text x="275" y="93" fill="#34d399" font-size="11" text-anchor="end">BIGINT (Cascade)</text>

    <!-- cantidad_disponible -->
    <text x="48" y="122" fill="#f1f5f9" font-size="12">cantidad_disponible</text>
    <text x="275" y="122" fill="#94a3b8" font-size="11" text-anchor="end">INTEGER</text>

    <!-- fecha_ingreso -->
    <text x="48" y="152" fill="#f1f5f9" font-size="12">fecha_ingreso</text>
    <text x="275" y="152" fill="#94a3b8" font-size="11" text-anchor="end">TIMESTAMP (current)</text>

    <!-- created_at / updated_at -->
    <line x1="14" y1="195" x2="275" y2="195" stroke="#334155" stroke-width="0.7" />
    <text x="48" y="215" fill="#64748b" font-size="11">created_at / updated_at</text>
    <text x="275" y="215" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP</text>
  </g>

  <!-- ========================================================= -->
  <!-- TABLA 5: PRODUCTOS                                        -->
  <!-- ========================================================= -->
  <g transform="translate(780, 410)" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect width="290" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Cabecera -->
    <path d="M 0 10 Q 0 0 10 0 L 280 0 Q 290 0 290 10 L 290 42 L 0 42 Z" fill="#064e3b" />
    <circle cx="20" cy="21" r="5" fill="#34d399" />
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">productos</text>
    <text x="275" y="26" fill="#a7f3d0" font-size="11" text-anchor="end">App\Models\Producto</text>

    <!-- Campos -->
    <!-- id -->
    <rect x="14" y="52" width="26" height="15" rx="3" fill="#fbbf24" />
    <text x="27" y="63" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="275" y="64" fill="#94a3b8" font-size="11" text-anchor="end">BIGINT (Auto)</text>
    <line x1="14" y1="73" x2="275" y2="73" stroke="#334155" stroke-width="0.7" />

    <!-- nombre -->
    <text x="48" y="90" fill="#f1f5f9" font-size="12">nombre</text>
    <text x="275" y="90" fill="#94a3b8" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <!-- descripcion -->
    <text x="48" y="113" fill="#94a3b8" font-size="12">descripcion</text>
    <text x="275" y="113" fill="#64748b" font-size="11" text-anchor="end">TEXT (null)</text>

    <!-- precio_venta -->
    <text x="48" y="136" fill="#f1f5f9" font-size="12">precio_venta</text>
    <text x="275" y="136" fill="#94a3b8" font-size="11" text-anchor="end">DECIMAL(8,2)</text>

    <!-- unidad_medida -->
    <text x="48" y="159" fill="#f1f5f9" font-size="12">unidad_medida</text>
    <text x="275" y="159" fill="#94a3b8" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <!-- estado -->
    <text x="48" y="182" fill="#f1f5f9" font-size="12">estado</text>
    <text x="275" y="182" fill="#34d399" font-size="11" text-anchor="end">ENUM('activo','inactivo')</text>

    <!-- created_at / updated_at -->
    <line x1="14" y1="215" x2="275" y2="215" stroke="#334155" stroke-width="0.7" />
    <text x="48" y="235" fill="#64748b" font-size="11">created_at / updated_at</text>
    <text x="275" y="235" fill="#64748b" font-size="11" text-anchor="end">TIMESTAMP</text>
  </g>
</svg>
